# Weekly catalog refresh — the automated updater Lucas approved (2026-07-25).
#
# Runs the same pipeline a session would: refresh signals + freshness receipts,
# scout new candidates, safety-skim anything new, honesty-gate the result.
# It NEVER pushes to main: changes go up as a PR for Lucas's review, and any
# safety-skim red flag is named in the PR body and held for a human read.
#
# Requires (one-time, repo Settings → Actions → General):
#   ☑ Allow GitHub Actions to create and approve pull requests
name: catalog-refresh

on:
  schedule:
    - cron: "0 14 * * 1,4" # Mondays + Thursdays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh exposure signals + freshness receipts (incl. HEAD sha)
        run: python3 scripts/refresh_signals.py

      - name: Expire reviews whose repo moved on
        # Runs BEFORE anything else spends effort: an entry whose upstream moved
        # past its reviewed commit is demoted to `scouted` here, so the rest of
        # the pipeline never operates on a review that already stopped being true.
        # The honesty gate at the end treats a surviving stale review as a
        # blocking error — if this step is ever removed, the build stops instead
        # of shipping a decayed claim.
        run: python3 scripts/validate_index.py --downgrade-stale | tee /tmp/stale.log

      - name: Scout new candidates (dedupes against existing)
        run: python3 scripts/scout_scrape.py --cap 15 | tee /tmp/scout.log

      - name: Safety-skim (flagged repos are pulled off the site)
        run: |
          python3 scripts/safety_skim.py | tee /tmp/skim.log || true
          # Flagged repos are removed from the published catalog and parked in
          # grading/quarantine.json — the count is FYI, not a review queue.
          sed -n 's/^QUARANTINED_COUNT=//p' /tmp/skim.log | tail -1 > /tmp/redcount
          [ -s /tmp/redcount ] || echo 0 > /tmp/redcount

      - name: Deep source review (reads source; never runs it)
        # ORDER MATTERS: runs AFTER the safety skim so review effort is never
        # spent on a repo that is about to be quarantined, and BEFORE the honesty
        # gate so anything it writes is gated like everything else.
        #
        # CI has no Claude subscription, so it can only use the metered API path.
        # That is deliberately OPT-IN: ~30 of the 53 catalogued repos push in any
        # given week, so an always-on API review is a recurring bill. The default
        # way to run this is `python3 scripts/deep_review.py` on a machine with a
        # Claude subscription (backend `cli`), which costs nothing per run.
        #
        # With no secret set this step is a no-op and says so. A missing key must
        # leave the catalog honestly under-reviewed, never block the refresh and
        # never fabricate a tier.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            {
              echo "No ANTHROPIC_API_KEY secret — metered review skipped by design."
              echo "Entries stay at whatever tier their evidence supports."
              echo "Reviews are expected to come from a subscription run:"
              echo "  python3 scripts/deep_review.py"
            } | tee /tmp/review.log
            exit 0
          fi
          pip install --quiet 'anthropic>=0.105'
          python3 scripts/deep_review.py --backend api --max-cost 5.00 \
            | tee /tmp/review.log || true

      # The three checks below no longer abort the run — see "Open PR" for why.
      # They still decide whether the result is safe to merge; they just stop
      # throwing away four steps of good work on their way out.
      - name: Honesty gate
        id: gate
        continue-on-error: true
        run: python3 scripts/validate_index.py | tee /tmp/gate.log

      - name: Prove the gate still fails closed
        id: gatetest
        continue-on-error: true
        # The gate is the only thing standing between a decayed claim and the
        # site, so every run re-proves it rejects deliberately-broken data
        # (missing review block, mismatched sha, invented touches value, …).
        # A gate nobody has watched reject anything is not evidence of anything.
        run: python3 scripts/test_review_gate.py

      - name: Prove the published install command still installs a working skill
        # Broke twice on 2026-08-03, the same way both times: a file was added to
        # the skill and the install command, which names each file explicitly,
        # was not updated. That ships a SKILL.md pointing at files that are not
        # there, and nothing would have said so.
        id: installtest
        continue-on-error: true
        run: python3 scripts/test_install_command.py

      # CHANGED 2026-08-09 — fail partial, never vanish.
      #
      # On 08-03 the gate self-test failed on a bad fixture. The job exited there,
      # so the four steps of real work before it (refreshed signals, 17 stale
      # demotions, scouted candidates, safety skim) were thrown away, no PR was
      # opened, and nothing told anyone. The catalog then sat frozen until 08-09.
      #
      # A check failing is a reason not to MERGE. It was never a reason to discard
      # the work and go quiet. So this step now runs even when a check failed, and
      # the PR says so at the top in words. The run still ends red (see the last
      # step) so the nightly watchdog reports it the same night.
      - name: Open PR if anything changed
        if: always()
        run: |
          if git diff --quiet docs/data/skills.json grading/quarantine.json; then
            echo "no changes — nothing to PR"; exit 0
          fi
          FAILED=""
          [ "${{ steps.gate.outcome }}" = "failure" ] && FAILED="$FAILED honesty-gate"
          [ "${{ steps.gatetest.outcome }}" = "failure" ] && FAILED="$FAILED gate-self-test"
          [ "${{ steps.installtest.outcome }}" = "failure" ] && FAILED="$FAILED install-command-test"
          RED=$(cat /tmp/redcount)
          DATE=$(date -u +%F)
          BRANCH="auto/catalog-refresh-$DATE"
          git config user.name "skillproof-refresh[bot]"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          git add docs/data/skills.json grading/quarantine.json
          git commit -m "Weekly catalog refresh $DATE (signals + scout + skim)"
          git push -u origin "$BRANCH"
          TITLE="Weekly catalog refresh $DATE"
          if [ -n "$FAILED" ]; then TITLE="⛔ DO NOT MERGE — $TITLE (failed:$FAILED)"; fi
          if [ "$RED" != "0" ]; then TITLE="$TITLE — $RED repo(s) quarantined, not published"; fi
          {
            if [ -n "$FAILED" ]; then
              echo "## ⛔ Do not merge this yet"
              echo
              echo "These checks failed:**$FAILED**"
              echo
              echo "The refresh work itself is here and is worth keeping — that is the only reason this PR exists. But a failed check means the data may claim something it cannot back up, so it must not reach the site until the failure is understood. Read the failing step in the run log, fix the cause, and re-run."
              echo
              echo "---"
              echo
            fi
            echo "Automated weekly run: signals refreshed, stale reviews expired, new candidates scouted, safety skim on everything new, deep source review."
            echo
            echo '### Tier split (derived from the data)'; echo '```'
            sed -n 's/^TIER_SPLIT=//p' /tmp/gate.log | tail -1; echo '```'
            echo '### Stale reviews expired'; echo '```'; grep '⤓' /tmp/stale.log || echo 'none — every review still describes its repo'\''s current HEAD'; echo '```'
            echo '### Deep review log (tail)'; echo '```'; tail -20 /tmp/review.log; echo '```'
            echo '### Scout log (tail)'; echo '```'; tail -20 /tmp/scout.log; echo '```'
            echo '### Skim log (tail)';  echo '```'; tail -20 /tmp/skim.log;  echo '```'
            echo
            echo "\`reviewed\` means an automated reviewer READ the full source at the commit named in \`review.source_sha\`. Nothing was installed and nothing was executed — see [methodology](https://lucascashwell3-ai.github.io/Skillproof/methodology.html#) for what that does and does not establish."
            echo
            echo "Any repo the scanner flagged was REMOVED from the catalog and parked in \`grading/quarantine.json\` — it is not on the site. The honesty gate blocks the merge if a flagged repo ever appears in the published data."
            echo
            echo "See what's quarantined: \`python3 scripts/quarantine.py --list\`"
            echo "Restore one only after reading its source: \`python3 scripts/quarantine.py --restore <id> --reason \"...\"\`"
          } > /tmp/pr-body.md
          gh pr create --title "$TITLE" --body-file /tmp/pr-body.md --base main --head "$BRANCH"

      # Fail loud. The steps above kept the work; this makes sure the run still ends RED so the
      # nightly watchdog reports it as broken the same night. A job that rescues its own output
      # and then reports success is the silent no-op this whole redesign exists to kill.
      - name: End red if any check failed
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.gate.outcome }}" = "failure" ] && FAILED="$FAILED honesty-gate"
          [ "${{ steps.gatetest.outcome }}" = "failure" ] && FAILED="$FAILED gate-self-test"
          [ "${{ steps.installtest.outcome }}" = "failure" ] && FAILED="$FAILED install-command-test"
          if [ -n "$FAILED" ]; then
            echo "::error title=Catalog refresh checks failed::$FAILED — the work was saved to a PR marked DO NOT MERGE."
            exit 1
          fi
          echo "All checks passed."
