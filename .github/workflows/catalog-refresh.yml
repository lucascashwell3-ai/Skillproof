# Weekly catalog refresh — the automated updater Lucas approved (2026-07-25).
#
# Runs the same pipeline a session would: refresh signals + freshness receipts,
# scout new candidates, safety-skim anything new, honesty-gate the result.
# It NEVER pushes to main: changes go up as a PR for Lucas's review, and any
# safety-skim red flag is named in the PR body and held for a human read.
#
# Requires (one-time, repo Settings → Actions → General):
#   ☑ Allow GitHub Actions to create and approve pull requests
name: catalog-refresh

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh exposure signals + freshness receipts
        run: python3 scripts/refresh_signals.py

      - name: Scout new candidates (dedupes against existing)
        run: python3 scripts/scout_scrape.py --cap 15 | tee /tmp/scout.log

      - name: Safety-skim (uncleared flags are held from install plans)
        run: |
          python3 scripts/safety_skim.py | tee /tmp/skim.log || true
          # Count only entries that still NEED a human read. Entries a human
          # already cleared (and whose code hasn't changed since) are reported
          # in the body but must not inflate the title — a headline number that
          # never falls is a number reviewers learn to ignore.
          sed -n 's/^NEEDS_REVIEW_COUNT=//p' /tmp/skim.log | tail -1 > /tmp/redcount
          [ -s /tmp/redcount ] || echo 0 > /tmp/redcount

      - name: Honesty gate
        run: python3 scripts/validate_index.py

      - name: Open PR if anything changed
        run: |
          if git diff --quiet docs/data/skills.json; then
            echo "no changes — nothing to PR"; exit 0
          fi
          RED=$(cat /tmp/redcount)
          DATE=$(date -u +%F)
          BRANCH="auto/catalog-refresh-$DATE"
          git config user.name "skillproof-refresh[bot]"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          git add docs/data/skills.json
          git commit -m "Weekly catalog refresh $DATE (signals + scout + skim)"
          git push -u origin "$BRANCH"
          TITLE="Weekly catalog refresh $DATE"
          if [ "$RED" != "0" ]; then TITLE="$TITLE — $RED NEW skim flag(s) need a human read"; fi
          {
            echo "Automated weekly run: signals refreshed, new candidates scouted, safety skim on everything new, honesty gate passed."
            echo
            echo '### Scout log (tail)'; echo '```'; tail -20 /tmp/scout.log; echo '```'
            echo '### Skim log (tail)';  echo '```'; tail -20 /tmp/skim.log;  echo '```'
            echo
            echo "Entries flagged with no valid human clearance are marked \`skim.held\`: they stay listed for transparency but CANNOT be added to a stack or an install plan, and the honesty gate fails if that is ever untrue."
            echo
            echo "To clear one after reading its source: \`python3 scripts/clear_flag.py --id <entry-id> --reason \"...\"\`"
            echo "A clearance is pinned to the repo's commit at review time and expires automatically when new code is pushed."
          } > /tmp/pr-body.md
          gh pr create --title "$TITLE" --body-file /tmp/pr-body.md --base main --head "$BRANCH"
