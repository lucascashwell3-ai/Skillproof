# Runs the copy-paste install commands from README.md and the site on real Windows,
# Mac and Linux machines. Manual only — nothing triggers it on its own. Run it on a
# branch before merging any change to an install command:
#   gh api -X POST repos/lucascashwell3-ai/Skillproof/actions/workflows/install-check.yml/dispatches -f ref=<branch>
name: install-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: README Windows line, Windows PowerShell 5.1
        shell: powershell
        run: |
          $line = (Get-Content README.md | Where-Object { $_ -like 'foreach ($f in*' } | Select-Object -First 1)
          if (-not $line) { throw 'no PowerShell line in README.md' }
          Invoke-Expression $line
          $files = Get-ChildItem "$HOME\.claude\skills\skillproof" -Recurse -File
          $files | ForEach-Object { "$($_.FullName)  $($_.Length)" }
          if ($files.Count -ne 6) { throw "expected 6 files, got $($files.Count)" }
          $head = Get-Content "$HOME\.claude\skills\skillproof\SKILL.md" -TotalCount 2
          if ($head[0] -ne '---' -or $head[1] -ne 'name: skillproof') { throw "bad SKILL.md start: $head" }
          Remove-Item "$HOME\.claude\skills\skillproof" -Recurse -Force
          'OK: 6 files, SKILL.md starts with name: skillproof'
      - name: README Windows line, PowerShell 7
        shell: pwsh
        run: |
          $line = (Get-Content README.md | Where-Object { $_ -like 'foreach ($f in*' } | Select-Object -First 1)
          Invoke-Expression $line
          $files = Get-ChildItem "$HOME\.claude\skills\skillproof" -Recurse -File
          if ($files.Count -ne 6) { throw "expected 6 files, got $($files.Count)" }
          'OK: 6 files'
      - name: Plain curl in Windows PowerShell 5.1 is not curl (why the skill says curl.exe)
        shell: powershell
        run: |
          try { curl -fsSL https://raw.githubusercontent.com/lucascashwell3-ai/Skillproof/main/README.md | Out-Null; 'plain curl worked' }
          catch { "plain curl failed as expected: $($_.Exception.Message)" }
      - name: One shelf skill the install-paths way, no git (PowerShell 7)
        shell: pwsh
        run: |
          $dest = "$HOME\.claude\skills\grill-me"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $list = curl.exe -fsSL "https://api.github.com/repos/mattpocock/skills/contents/skills/productivity/grill-me?ref=main" | ConvertFrom-Json
          foreach ($item in $list) {
            if ($item.type -eq 'file') { curl.exe -fsSL $item.download_url -o (Join-Path $dest $item.name) }
          }
          Get-ChildItem $dest | ForEach-Object { "$($_.Name)  $($_.Length)" }
          if (-not (Test-Path "$dest\SKILL.md")) { throw 'grill-me SKILL.md missing' }
          'OK: grill-me SKILL.md saved without git'
      - name: MCP Windows line from the site (minus the final claude command), Windows PowerShell 5.1
        shell: powershell
        run: |
          $html = Get-Content docs/index.html -Raw
          $m = [regex]::Match($html, '<div class="cmdbox inst-cmd">(git clone https://github.com/lucascashwell3-ai/Skillproof; [^<]+)</div>')
          if (-not $m.Success) { throw 'no Windows MCP line on the site' }
          $line = [System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value)
          $line
          $prep = $line.Substring(0, $line.IndexOf('; claude mcp add'))
          Set-Location $env:RUNNER_TEMP
          Invoke-Expression $prep
          $server = "$PWD/server.js"
          if (-not (Test-Path $server)) { throw "server.js not found at $server" }
          node --check $server
          "OK: cloned, npm installed, $server exists"
  windows-git-bash:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: README Mac/Linux line in Git Bash on Windows
        run: |
          line=$(grep -m1 '^for f in SKILL.md' README.md)
          bash -c "$line"
          n=$(find ~/.claude/skills/skillproof -type f | wc -l)
          echo "files: $n"; test "$n" -eq 6
          head -2 ~/.claude/skills/skillproof/SKILL.md
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: README Mac/Linux line
        run: |
          line=$(grep -m1 '^for f in SKILL.md' README.md)
          bash -c "$line"
          n=$(find ~/.claude/skills/skillproof -type f | wc -l | tr -d ' ')
          echo "files: $n"; test "$n" -eq 6
          head -2 ~/.claude/skills/skillproof/SKILL.md
